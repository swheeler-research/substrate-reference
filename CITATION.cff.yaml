type: software
title: "The Sovereign Substrate: Reference Implementation"
abstract: "Python reference implementation of the Sovereign Substrate architecture. Approximately 3,500 lines of core substrate code, 4,500 lines of tests, and 9,000 lines of worked examples; 225 passing tests and twelve end-to-end demonstrations against substantively different problems (Universal Credit single and cross-operator, Horizon, Robodebt, Lavender, SolarWinds, CrowdStrike, Boeing 737 MAX, Five Eyes, LIBOR, London Whale, constitutional anchoring). Conforms to the architecture specified in the companion paper; the principal architectural treatise develops the constitutional argument."
